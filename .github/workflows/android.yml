name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK) 
      # Change '17' to your required version (e.g., 11 or 21) if needed
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      # Step 3: Grant execution permissions to ensure gradlew can run
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 4: Run the Gradle build with memory limitations to prevent OOM errors
      # Uses --no-daemon to save memory on the GitHub runner environment
      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      # Step 5: Upload the generated APK so you can download it from the workflow summary
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
