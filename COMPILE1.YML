workflows:
  android-apk:
    name: Build Android APK
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
